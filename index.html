<style>
*{box-sizing:border-box}html,body{margin:0;background:#070C0A;color:#E6F2EC;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;
background:radial-gradient(900px 500px at 80% -10%,rgba(56,217,245,.10),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(61,245,160,.09),transparent 60%),#070C0A}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(61,245,160,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(61,245,160,.035) 1px,transparent 1px);background-size:32px 32px}
.box{position:relative;width:100%;max-width:380px;background:linear-gradient(180deg,#0F1A16,#0B1310);border:1px solid #1E3229;border-radius:20px;padding:28px 24px;text-align:center}
.ats{background:#fff;border-radius:14px;padding:10px 14px;display:inline-block;margin:0 auto 16px;box-shadow:0 0 0 1px rgba(61,245,160,.25),0 0 28px rgba(61,245,160,.18)}.ats img{height:64px;width:auto;display:block}[hidden]{display:none!important}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(140deg,#123426,#0B1C15);border:1px solid #2A4538;box-shadow:0 0 0 1px rgba(61,245,160,.25),0 0 28px rgba(61,245,160,.2)}
h1{margin:0;font:700 22px "Space Grotesk",sans-serif}h1 span{color:#3DF5A0}
p{color:#86A194;font-size:13.5px;margin:6px 0 22px;line-height:1.5}
label{display:block;text-align:left;font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#86A194;margin-bottom:8px}
.row{position:relative}
input{width:100%;height:50px;border-radius:12px;border:1px solid #2A4538;background:#0B1310;color:#E6F2EC;font:600 18px "JetBrains Mono",monospace;letter-spacing:.12em;padding:0 50px 0 16px;outline:none}
input:focus{border-color:#3DF5A0;box-shadow:0 0 0 3px rgba(61,245,160,.15)}
.eye{position:absolute;right:6px;top:6px;width:38px;height:38px;border:0;background:transparent;color:#86A194;cursor:pointer;border-radius:8px}
.chk{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin:14px 0 18px;font-size:13px;color:#86A194;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#3DF5A0;padding:0}
button.go{width:100%;height:50px;border:0;border-radius:12px;background:linear-gradient(180deg,#3DF5A0,#1FB874);color:#04120B;font:700 16px Inter,sans-serif;cursor:pointer;box-shadow:0 0 24px rgba(61,245,160,.3)}
button.go:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:13px;color:#FF5C6C;font-weight:600}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foot{margin-top:18px;font-size:11.5px;color:#567064}
